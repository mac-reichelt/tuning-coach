version: 2
updates:
  - package-ecosystem: cargo
    directory: /sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels: ["type:chore", "area:sidecar", "deps", "automerge"]

  - package-ecosystem: npm
    directory: /overlay
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels: ["type:chore", "area:overlay", "deps", "automerge"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: scope
    labels: ["type:ci", "deps", "automerge"]
