name: security-review

# LLM-driven security review. Uses security-review.agent.md as the system
# prompt. Audits deeply when changed files include workflow/action files,
# shell scripts, or files with security-sensitive names (auth, crypto, secret,
# oidc, token). Docs-only PRs are skipped. All other PRs post a passing
# skip-success check so this can be a required check without blocking
# unrelated work.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write
  pull-requests: write
  models: read

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: security-review verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAX_DIFF_BYTES: '25000'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect PR context + decide skip
        id: ctx
        run: |
          set -euo pipefail
          SKIP_REASON=""

          mapfile -t FILES < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')

          # Block list: docs-only PRs are never in-scope
          DOCS_ONLY=true
          if [[ "${#FILES[@]}" -eq 0 ]]; then
            DOCS_ONLY=false
          fi
          for f in "${FILES[@]}"; do
            if [[ "$f" != docs/* && "$f" != *.md && "$f" != ".github/dependabot.yml" ]]; then
              DOCS_ONLY=false
              break
            fi
          done
          if [[ "$DOCS_ONLY" == "true" ]]; then
            SKIP_REASON="docs-only"
          fi

          # In-scope: workflow/action files, shell scripts, or files with
          # security-sensitive names (auth, crypto, secret, oidc, token)
          IN_SCOPE=false
          if [[ -z "$SKIP_REASON" ]]; then
            for f in "${FILES[@]}"; do
              if [[ "$f" == .github/workflows/* || "$f" == .github/actions/* || "$f" == *.sh ]]; then
                IN_SCOPE=true
                break
              fi
              # Case-insensitive match on any path segment
              f_lower="${f,,}"
              if [[ "$f_lower" == *auth* || "$f_lower" == *crypto* || \
                    "$f_lower" == *secret* || "$f_lower" == *oidc* || \
                    "$f_lower" == *token* ]]; then
                IN_SCOPE=true
                break
              fi
            done
          fi

          if [[ "$IN_SCOPE" == "false" && -z "$SKIP_REASON" ]]; then
            SKIP_REASON="no-security-relevant-changes"
          fi

          {
            echo "skip_reason=${SKIP_REASON}"
            echo "changed_files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run security-review agent (GitHub Models)
        if: steps.ctx.outputs.skip_reason == ''
        id: review
        env:
          CHANGED_FILES: ${{ steps.ctx.outputs.changed_files }}
        run: |
          set -euo pipefail

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -H "Accept: application/vnd.github.v3.diff" > /tmp/security-diff-full.txt
          head -c "${MAX_DIFF_BYTES}" /tmp/security-diff-full.txt > /tmp/security-diff.txt
          diff_content="$(cat /tmp/security-diff.txt)"
          prompt_content="$(cat .github/agents/security-review.agent.md)"

          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            --arg files "$CHANGED_FILES" \
            --arg diff "$diff_content" \
            --arg prompt "$prompt_content" \
            '{
              model: "gpt-4.1",
              temperature: 0.1,
              messages: [
                {
                  role: "system",
                  content: "You are the tuning-coach security reviewer. Apply the security conventions in the supplied security-review.agent.md verbatim. Focus on OWASP Top 10, GitHub Actions security (pull_request_target safety, token scopes, secrets exposure, third-party action SHA pinning, PR-code-execution risks), Zero Trust, and any auth/crypto/OIDC changes. Use REQUEST_CHANGES only for genuine security vulnerabilities or misconfigurations. Use COMMENT for non-blocking recommendations. Use APPROVE when no security issues are found. Output strict JSON: {\"verdict\":\"APPROVE|REQUEST_CHANGES|COMMENT\",\"summary\":\"string\",\"findings_markdown\":\"string\"}"
                },
                {
                  role: "user",
                  content: ("Security review of PR #" + $pr + ".\n\nBase SHA: " + $base + "\nHead SHA: " + $head + "\n\nChanged files:\n" + $files + "\n\nFull diff:\n" + $diff + "\n\nSecurity review conventions (.github/agents/security-review.agent.md):\n" + $prompt)
                }
              ]
            }' > /tmp/security-req.json

          REQ_BYTES=$(wc -c < /tmp/security-req.json)
          if [ "$REQ_BYTES" -gt 90000 ]; then
            echo "::warning::Request body ${REQ_BYTES} bytes exceeds LLM budget; defaulting to APPROVE"
            {
              echo "verdict=APPROVE"
              echo "summary<<EOF"
              echo "Security review skipped: PR diff plus context (${REQ_BYTES} bytes) exceeds the GitHub Models input budget. Please verify security-sensitive changes manually."
              echo "EOF"
              echo "findings<<EOF"
              echo "_Skipped: payload exceeded GitHub Models 8K-token input limit._"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl -fsSL "https://models.inference.ai.azure.com/chat/completions" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/security-req.json > /tmp/security-resp.json

          raw="$(jq -r '.choices[0].message.content // ""' /tmp/security-resp.json)"
          parsed="$(RAW="$raw" python3 -c 'import os; s=os.environ["RAW"].strip(); s="\n".join(l for l in s.splitlines() if not l.strip().startswith("```")).strip() if s.startswith("```") else s; i,j=s.find("{"),s.rfind("}"); print(s[i:j+1] if i!=-1 and j>=i else s)')"

          if printf '%s' "$parsed" | jq -e . >/dev/null 2>&1; then
            verdict=$(printf '%s' "$parsed" | jq -r '.verdict // "COMMENT"' | tr '[:lower:]' '[:upper:]')
            summary=$(printf '%s' "$parsed" | jq -r '.summary // "Security review completed."')
            findings=$(printf '%s' "$parsed" | jq -r '.findings_markdown // "No issues found."')
          else
            verdict="COMMENT"
            summary="Security response could not be parsed; posted as comment."
            findings="$raw"
          fi

          case "$verdict" in
            APPROVE|REQUEST_CHANGES|COMMENT) ;;
            *) verdict="COMMENT" ;;
          esac

          {
            echo "verdict=${verdict}"
            echo "summary<<EOF"
            printf '%s\n' "$summary"
            echo "EOF"
            echo "findings<<EOF"
            printf '%s\n' "$findings"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set skip verdict
        if: steps.ctx.outputs.skip_reason != ''
        id: skipped
        run: |
          set -euo pipefail
          reason="${{ steps.ctx.outputs.skip_reason }}"
          {
            echo "verdict=COMMENT"
            echo "summary=Security review skipped (${reason})."
            echo "findings<<EOF"
            echo "Security review skipped for this PR (${reason})."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish PR review (when in-scope)
        if: steps.ctx.outputs.skip_reason == ''
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          SUMMARY: ${{ steps.review.outputs.summary }}
          FINDINGS: ${{ steps.review.outputs.findings }}
        run: |
          set -euo pipefail
          {
            echo "security-review verdict: $VERDICT"
            echo
            echo "$SUMMARY"
            echo
            echo "$FINDINGS"
          } > /tmp/security-review-body.txt
          jq -n --rawfile body /tmp/security-review-body.txt '{event:"COMMENT", body:$body}' \
            | gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --input - >/dev/null

      - name: Publish security-review check-run
        if: always()
        env:
          IN_SCOPE_VERDICT: ${{ steps.review.outputs.verdict }}
          IN_SCOPE_SUMMARY: ${{ steps.review.outputs.summary }}
          IN_SCOPE_FINDINGS: ${{ steps.review.outputs.findings }}
          SKIP_VERDICT: ${{ steps.skipped.outputs.verdict }}
          SKIP_SUMMARY: ${{ steps.skipped.outputs.summary }}
          SKIP_FINDINGS: ${{ steps.skipped.outputs.findings }}
          SKIP_REASON: ${{ steps.ctx.outputs.skip_reason }}
        run: |
          set -euo pipefail
          if [ -z "$SKIP_REASON" ]; then
            VERDICT="$IN_SCOPE_VERDICT"
            SUMMARY="$IN_SCOPE_SUMMARY"
            FINDINGS="$IN_SCOPE_FINDINGS"
          else
            VERDICT="$SKIP_VERDICT"
            SUMMARY="$SKIP_SUMMARY"
            FINDINGS="$SKIP_FINDINGS"
          fi

          conclusion='success'
          if [ "$VERDICT" = "REQUEST_CHANGES" ]; then
            conclusion='failure'
          fi
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          existing_id="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=security-review" --jq '.check_runs[0].id // empty')"
          payload=$(jq -n \
            --arg head_sha "$HEAD_SHA" \
            --arg completed_at "$completed_at" \
            --arg conclusion "$conclusion" \
            --arg title "security-review: $VERDICT" \
            --arg text "$FINDINGS" \
            '{name:"security-review",head_sha:$head_sha,status:"completed",conclusion:$conclusion,completed_at:$completed_at,output:{title:$title,summary:$title,text:$text}}')

          if [ -n "$existing_id" ]; then
            update=$(jq 'del(.name,.head_sha)' <<<"$payload")
            gh api "repos/${GITHUB_REPOSITORY}/check-runs/${existing_id}" -X PATCH --input - <<<"$update" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/check-runs" -X POST --input - <<<"$payload" >/dev/null
          fi
