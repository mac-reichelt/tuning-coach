name: release-build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sidecar:
    if: startsWith(github.event.release.tag_name, 'v')
    name: sidecar (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tuning-coach-sidecar.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tuning-coach-sidecar
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libsqlite3-dev \
            tesseract-ocr libtesseract-dev libleptonica-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p ../dist
          src="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          cp "$src" "../dist/${{ matrix.artifact }}"

      - name: Upload to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist/${{ matrix.artifact }}
          tag_name: ${{ github.event.release.tag_name }}

  dashboard:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Package dashboard bundle
        run: |
          mkdir -p dist
          (cd simhub && zip -r ../dist/tuning-coach-dashboard.zip .)

      - name: Upload to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist/tuning-coach-dashboard.zip
          tag_name: ${{ github.event.release.tag_name }}
