name: stale

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 14
            days unless someone comments or removes the `stale` label.
          close-issue-message: |
            Closing as stale. Reopen if this is still relevant.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: |
            This PR has been inactive for 30 days. It will be closed in 14
            days unless updated. Reopen any time.
          exempt-issue-labels: 'priority:p0,priority:p1,security'
          exempt-pr-labels: 'priority:p0,priority:p1,security'
          operations-per-run: 50
