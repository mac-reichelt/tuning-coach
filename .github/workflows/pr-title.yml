name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    # Dependabot generates its own conventional titles (e.g. "chore(deps): Bump
    # X"), whose capitalized subject trips subjectPattern. This check is not a
    # required status check, so skipping it for Dependabot avoids a spurious red
    # X without blocking merges.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+
          subjectPatternError: |
            The PR subject "{subject}" should start with a lowercase letter.
            Example: feat(sidecar): parse Forza UDP Dash packet
