<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuning Coach</title>
  <link rel="stylesheet" href="styles/overlay.css" />
</head>
<body>

  <!-- ── Connection-status bar ─────────────────────────────── -->
  <!--
    Visible only when NOT connected (hidden via CSS when data-state="connected").
    States: connected | reconnecting | down
  -->
  <div id="connection-status" data-state="reconnecting" role="status" aria-live="polite">
    <span class="status-dot"></span>
    <span id="connection-status-text">Connecting…</span>
  </div>

  <!-- ── Lap-status badge (top-left) ──────────────────────── -->
  <div id="lap-status" data-status="unknown" role="status" aria-label="Lap status">—</div>

  <!-- ── Top-right control cluster ────────────────────────── -->
  <!--
    Row 1: telemetry-status pill (Live / Paused / No data)
    Row 2: HUD toggle + Raw Data toggle buttons side-by-side
  -->
  <div id="overlay-controls">
    <div id="telemetry-status" role="status" aria-live="polite"></div>
    <div id="overlay-buttons">
      <button id="hud-toggle" aria-label="Toggle telemetry HUD">HUD</button>
      <button id="dyno-toggle" aria-label="Toggle dyno panel">Dyno</button>
      <button id="track-toggle" aria-label="Toggle track map">Track</button>
      <button id="coach-toggle" aria-label="Toggle coach recommendations">Coach</button>
      <button id="raw-toggle" aria-label="Toggle raw telemetry data">Raw Data</button>
    </div>
  </div>

  <!-- ── Telemetry HUD ─────────────────────────────────────── -->
  <!--
    Populated by TelemetryHud; visible by default, toggle via #hud-toggle.
  -->
  <div id="telemetry-hud" aria-label="Telemetry HUD"></div>

  <!-- ── Dyno panel ──────────────────────────────────────────── -->
  <div id="dyno-panel" hidden></div>

  <!-- ── Track map ───────────────────────────────────────────── -->
  <div id="track-map" aria-label="Track map" hidden></div>

  <!-- ── Raw telemetry panel ───────────────────────────────── -->
  <div id="raw-telemetry-panel" hidden></div>

  <!-- ── Recommendation slot ───────────────────────────────── -->
  <!--
    Slides in from the right when visible. Shows placeholder card until
    Phase 7 heuristics emit a real recommendation.
  -->
  <div id="recommendation-slot" role="complementary" aria-label="Tuning recommendation"></div>

  <script type="module">
    import { WsClient }           from './src/ws-client.js';
    import { TelemetryHud }       from './src/telemetry-hud.js?v=20260525-6';
    import { LapStatus }          from './src/lap-status.js?v=20260525-6';
    import { RecommendationSlot } from './src/recommendation-slot.js?v=20260613-1';
    import { TelemetryStatus }    from './src/telemetry-status.js?v=20260613-1';
    import { RawTelemetryPanel }  from './src/raw-telemetry.js?v=20260525-8';
    import { DynoGraph }          from './src/dyno-graph.js?v=20260525-8';
    import { TrackMap }           from './src/track-map.js?v=20260613-2';

    // ── Init components ──────────────────────────────────────

    const hud    = new TelemetryHud(document.getElementById('telemetry-hud'));
    const badge  = new LapStatus(document.getElementById('lap-status'));
    const slot   = new RecommendationSlot(document.getElementById('recommendation-slot'));
    const tsIndicator = new TelemetryStatus(document.getElementById('telemetry-status'));
    const rawPanel    = new RawTelemetryPanel(
      document.getElementById('raw-telemetry-panel'),
      document.getElementById('raw-toggle'),
    );
    const dynoGraph = new DynoGraph(document.getElementById('dyno-panel'));
    const trackMap  = new TrackMap(document.getElementById('track-map'));

    // ── Connection-status UI ─────────────────────────────────

    const statusEl   = document.getElementById('connection-status');
    const statusText = document.getElementById('connection-status-text');

    function setConnectionState(state) {
      statusEl.dataset.state = state;
      const labels = {
        connected:    'Connected',
        reconnecting: 'Reconnecting…',
        down:         'Sidecar offline',
      };
      statusText.textContent = labels[state] ?? state;
    }

    // ── WebSocket client ─────────────────────────────────────

    // Allow overriding the sidecar WS URL for development/testing:
    //   /?ws=ws://127.0.0.1:39000/ws
    const client = new WsClient();

    client.addEventListener('statechange', (ev) => {
      setConnectionState(ev.detail.state);
    });

    // Apply user preferences / source info from the hello envelope.
    // hello is a flat envelope ({ type, schema_version, sidecar_version,
    // replay }) with no `data` field, so read it off the raw message event.
    client.addEventListener('message', (ev) => {
      if (ev.detail?.type === 'hello') {
        tsIndicator.setReplay(ev.detail.replay === true);
      }
    });

    client.addEventListener('telemetry', (ev) => {
      const data = ev.detail;
      hud.update(data);
      badge.updateFromTelemetry(data);
      tsIndicator.update(data.is_race_on);
      rawPanel.update(data.raw);
      dynoGraph.onTelemetry(data);
      trackMap.onTelemetry(data);
    });

    client.addEventListener('dyno_update', (ev) => {
      dynoGraph.onDynoUpdate(ev.detail);
    });

    client.addEventListener('recommendation', (ev) => {
      slot.showRecommendation(ev.detail);
    });

    // Session start/end — clear lap status on new session
    client.addEventListener('session_started', () => {
      badge.set('unknown');
    });

    client.addEventListener('session_ended', () => {
      badge.set('unknown');
    });

    // lap_dirty_detected — immediately flip badge even before next telemetry tick
    client.addEventListener('lap_dirty_detected', () => {
      badge.set('dirty');
    });

    // lap_clean_marked — reset to valid for the new lap
    client.addEventListener('lap_clean_marked', () => {
      badge.set('valid');
    });

    // Pit-stop span — colour the track-map trail and drop a start marker.
    client.addEventListener('pit_stop_started', () => {
      trackMap.onPitStart();
    });
    client.addEventListener('pit_stop_ended', () => {
      trackMap.onPitEnd();
    });

    // WsClient manages 'reconnecting' → 'down' state internally after repeated
    // failed attempts; just reflect it in the status bar UI.

    // ── HUD toggle ───────────────────────────────────────────

    document.getElementById('hud-toggle').addEventListener('click', () => {
      hud.toggle();
    });

    // ── Dyno toggle ──────────────────────────────────────────

    document.getElementById('dyno-toggle').addEventListener('click', () => {
      dynoGraph.toggle();
    });

    // ── Track toggle ─────────────────────────────────────────

    document.getElementById('track-toggle').addEventListener('click', () => {
      trackMap.toggle();
    });

    // ── Coach toggle ─────────────────────────────────────────
    // Lets the user reopen the recommendation panel after dismissing or
    // snoozing it, so it can never be permanently lost.

    document.getElementById('coach-toggle').addEventListener('click', () => {
      slot.toggle();
    });

    // ── Start ────────────────────────────────────────────────

    client.connect();
  </script>
</body>
</html>
