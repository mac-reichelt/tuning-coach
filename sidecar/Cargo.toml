[package]
name = "tuning-coach-sidecar"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/mac-reichelt/tuning-coach"
description = "Tuning coach sidecar — Forza UDP telemetry ingest, heuristics, WS API."

[[bin]]
name = "tuning-coach-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
figment = { version = "0.10", features = ["env", "toml"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1.47.2"
proptest = "1.8.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serial_test = "3"
temp-env = "0.3"
tempfile = "3"
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
