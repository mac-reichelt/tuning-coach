[package]
name = "tuning-coach-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/mac-reichelt/tuning-coach"
description = "Tuning coach sidecar — Forza UDP telemetry ingest, heuristics, WS API."

[[bin]]
name = "tuning-coach-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
